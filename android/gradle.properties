# Heap diturunkan (dari 8G) karena mesin hanya punya 8GB RAM + swap 512MB;
# build memakai 8G heap menyebabkan RAM habis dan laptop hang (5 Agu 2026).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Batasi daemon Kotlin & worker agar total memori build tetap di bawah kapasitas RAM.
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.enableBuildMetadataCheck=false
